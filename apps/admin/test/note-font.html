<!doctype html>
<!-- e2e 夹具：scripts/e2e/admin-note-font.mjs 用它检查手记编辑器的思源宋体（只在后台开发服务器里打开，不会被打包） -->
<html><body style="margin:24px;background:#181818">
<div id="note"></div><div id="article"></div>
<script type="module">
import '@haklex/rich-kit-shiro/style.css'
import '/src/components/editor/rich/note-serif-font.ts'
import { noteVariant, articleVariant } from '@haklex/rich-editor'
const line = '330 块钱，一天不到就打了水漂。可也正是这 330 块，让我用上了今年最惊艳我的 AI 工具 Grok Heavy。'
for (const [id, cls, label] of [['note', noteVariant, '手记主题'], ['article', articleVariant, '文章主题']]) {
  const el = document.getElementById(id)
  el.className = `rich-editor ${cls}`
  el.style.cssText = 'color:#eee;font-size:18px;margin:12px 0'
  el.textContent = `${label}：${line}`
}
await document.fonts.ready
window.__result = {
  note: getComputedStyle(document.getElementById('note')).fontFamily,
  article: getComputedStyle(document.getElementById('article')).fontFamily,
  loadedSlices: [...document.fonts].filter((f) => f.family.includes('Noto Serif SC') && f.status === 'loaded').length,
}
</script>
</body></html>
