<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" role="img" aria-labelledby="title description">
  <title id="title">设计系统 v0.1：浅色、深色色板与文字配对</title>
  <desc id="description">直接使用 design-system.md 核心颜色表的十组颜色，固定展示浅色与深色模式。下方比较主要文字、次要文字及主操作背景和文字。</desc>
  <rect x="0" y="0" width="1080" height="980" fill="#FFFFFF" rx="0" />
  <text x="36" y="45" fill="#18181B" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">设计系统 v0.1 · 颜色实样</text>
  <text x="36" y="76" fill="#52525B" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">目前是中性色基线。左右两栏固定展示各自主题，不跟随编辑器主题变色。</text>
