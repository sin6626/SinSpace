packages:
  - apps/*
  - packages/*

allowBuilds:
  "@nestjs/core": false
  "@swc/core": false
  esbuild: false
  mongodb-memory-server: false
  redis-memory-server: false
  sharp: false
  unrs-resolver: false

patchedDependencies:
  "@lexical/code@0.41.0": patches/@lexical__code@0.41.0.patch

overrides:
